evaluation_name: "axolt-exp-2"
description: "Configuration file for evaluation of instruction-following models."

models:
  local: True # Set to True if the model is hosted locally of False if it is evlauated from huggingface
  models_names: checkpoint-1225,checkpoint-1467
  models_path: /leonardo_work/EUHPC_D22_034/modelos/Instruction/exp_2_A_Instruct_v22_3_data_v12_packing_noice # List of paths to the models to be evaluated

evaluation:
  evaluation_folder: /leonardo_work/EUHPC_D22_034/modelos/Instruction/exp_4_evaluaciones # Path to the folder where the evlaluation results will be stored
  evaluation_folder_gold: /leonardo_scratch/large/userexternal/sgaliano/evaluaciones_instruct_gold # Path where results of other evaluations are stored to be included in the final evaluation
  instruct: True
  shots: 0 # Number of shots to be used in the evaluation

wandb_project: "Aitana-7b-V12" # Name of the wandb project to log the results


languages:
  - Spanish: true # Set to true if want to evaluate the model in Spanish tasks
  - English: true # Set to true if want to evaluate the model in English tasks
  - Valencian: true # Set to true if want to evaluate the model in Valencian tasks
  - Catalan: true # Set to true if want to evaluate the model in Catalan tasks