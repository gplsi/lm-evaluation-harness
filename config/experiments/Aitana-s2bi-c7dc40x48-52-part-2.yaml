evaluation_name: "axolt-exp-0"
description: "Configuration file for evaluation of instruction-following models."

models:
  local: True # Set to True if the model is hosted locally of False if it is evlauated from huggingface
  models_names: e-001-gs-002008,e-001-gs-002677 #e-001-gs-003346  e-001-gs-004016
  models_path: /leonardo_scratch/large/userexternal/sgaliano/output/aitana-s2bi-c7dc40x48-52/aitana-s2bi-c7dc40x48-52_hf # List of paths to the models to be evaluated

evaluation:
  evaluation_folder: /leonardo_scratch/large/userexternal/sgaliano/output/aitana-s2bi-c7dc40x48-52/evaluaciones # Path to the folder where the evlaluation results will be stored
  evaluation_folder_gold: /leonardo_scratch/large/userexternal/sgaliano/evaluaciones_gold # Path where results of other evaluations are stored to be included in the final evaluation
  instruct: False
  shots: 0 # Number of shots to be used in the evaluation

wandb_project: "Aitana-7b-V12" # Name of the wandb project to log the results


languages:
  - Spanish: true # Set to true if want to evaluate the model in Spanish tasks
  - English: true # Set to true if want to evaluate the model in English tasks
  - Valencian: true # Set to true if want to evaluate the model in Valencian tasks
  - Catalan: true # Set to true if want to evaluate the model in Catalan tasks