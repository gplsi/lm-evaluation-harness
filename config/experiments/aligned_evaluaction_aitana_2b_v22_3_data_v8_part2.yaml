evaluation_name: "ALIA_aligned_instruction_v22_3_data_v8"
description: "Configuration file for evaluation of instruction-following models."

models:
  local: True # Set to True if the model is hosted locally of False if it is evlauated from huggingface
  models_names: checkpoint-2285
  models_path: /leonardo_work/EUHPC_D22_034/modelos/Alingment/ALIA_aligned_instruction_v22_3_data_v8/hf_models

evaluation:
  evaluation_folder: /leonardo_work/EUHPC_D22_034/modelos/Alingment/ALIA_aligned_instruction_v22_3_data_v8/evaluaciones # Path to the folder where the evlaluation results will be stored
  evaluation_folder_gold: /leonardo_scratch/large/userexternal/sgaliano/evaluaciones_instruct_gold # Path where results of other evaluations are stored to be included in the final evaluation
  instruct: True
  shots: 0 # Number of shots to be used in the evaluation

wandb_project: "v22-long-sequence-3-epoch-instruct-evaluation" # Name of the wandb project to log the results


languages:
  - Spanish: false # Set to true if want to evaluate the model in Spanish tasks
  - English: false # Set to true if want to evaluate the model in English tasks
  - Valencian: true # Set to true if want to evaluate the model in Valencian tasks
  - Catalan: false # Set to true if want to evaluate the model in Catalan tasks